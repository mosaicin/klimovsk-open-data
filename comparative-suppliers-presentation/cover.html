<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:'Noto Sans',Arial,sans-serif}.slide-container{width:1280px;min-height:720px;background:#202326;color:#F4F0E8;position:relative;overflow:hidden;padding:72px 84px}.kicker{font-size:16px;letter-spacing:3px;text-transform:uppercase;color:#C9A45C}.title{font-size:58px;line-height:1.04;font-weight:700;max-width:700px;margin-top:78px}.subtitle{font-size:24px;line-height:1.35;color:#D8D3C8;max-width:650px;margin-top:28px}.meta{position:absolute;left:84px;bottom:72px;font-size:15px;color:#A7AAA8;letter-spacing:1px}.rule{width:86px;height:4px;background:#C9A45C;margin-top:26px}.field{position:absolute;right:84px;top:72px;width:370px;height:575px;border:1px solid #6C675D}.field:before,.field:after{content:'';position:absolute;background:#C9A45C}.field:before{width:1px;height:100%;left:102px;top:0;opacity:.55}.field:after{height:1px;width:100%;top:180px;left:0;opacity:.55}.stamp{position:absolute;right:32px;bottom:34px;border:1px solid #C9A45C;padding:12px 16px;color:#C9A45C;font-size:13px;letter-spacing:2px}.smallline{position:absolute;left:46px;top:42px;width:220px;height:1px;background:#6C675D}.square{position:absolute;right:104px;top:252px;width:115px;height:115px;border:2px solid #C9A45C}.square:after{content:'';position:absolute;left:28px;top:28px;width:55px;height:55px;background:#C9A45C;opacity:.22}.footerline{position:absolute;left:84px;right:84px;bottom:38px;height:1px;background:#514F49}
</style></head>
<body><div class="slide-container">
<div class="kicker">Открытые данные · закупки 44-ФЗ</div><div class="rule"></div>
<div class="title">ООО «Областной<br/>центр дезинфекции»</div>
<div class="subtitle">Сопоставимые поставщики, контракты и проверка индикаторов аффилированности</div>
<div class="meta">Состояние проверки: август 2026 года</div>
<div class="field"><div class="smallline"></div><div class="square"></div><div class="stamp">FACT / SIGNAL / LIMIT</div></div>
<div class="footerline"></div>
</div></body></html>
