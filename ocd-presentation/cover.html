<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1.0" />
<title>ООО «Областной центр дезинфекции»</title>
<style>
:root{--bg:#0b1420;--ink:#f4f7f8;--muted:#9eabb4;--cyan:#5fd5c8;--amber:#e6ad63;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b1420;color:var(--ink)}
.slide-container{width:1280px;min-height:720px;background:linear-gradient(120deg,#0b1420 0%,#101e2c 65%,#172a34 100%);position:relative;overflow:hidden;padding-top:0}
.rule{position:absolute;left:108px;top:112px;width:7px;height:302px;background:var(--amber)}
.eyebrow{position:absolute;left:146px;top:112px;color:var(--cyan);font-size:16px;letter-spacing:3px;text-transform:uppercase}
h1{position:absolute;left:146px;top:164px;width:770px;font-size:58px;line-height:1.04;font-weight:700;letter-spacing:-1px;margin:0}
.subtitle{position:absolute;left:150px;top:454px;width:690px;color:#d6dfe3;font-size:25px;line-height:1.35}
.meta{position:absolute;right:104px;bottom:88px;width:330px;border-top:1px solid #4b5c66;padding-top:18px;color:var(--muted);font-size:16px;line-height:1.6}
.meta strong{color:var(--ink);font-weight:600}.mark{position:absolute;right:104px;top:122px;width:126px;height:126px;border:1px solid #5fd5c8;border-radius:50%;opacity:.75}.mark:after{content:"";position:absolute;left:62px;top:15px;width:1px;height:96px;background:#e6ad63;transform:rotate(45deg)}
</style>
</head>
<body>
<div class="slide-container">
<div class="rule"></div><div class="eyebrow">ОТКРЫТЫЕ ДАННЫЕ · 2026</div>
<h1>ООО «Областной<br>центр дезинфекции»</h1>
<div class="subtitle">ЕГРЮЛ, закупки 44‑ФЗ и связанные юридические лица</div>
<div class="mark"></div>
<div class="meta"><strong>Срез данных</strong><br>15 августа 2026 года<br>Нейтральный аналитический обзор</div>
</div>
</body>
</html>
